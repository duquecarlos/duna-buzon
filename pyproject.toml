[project]
name = "duna-buzon"
version = "0.1.0"
description = "The mailbox connector: reads Carlos's Hotmail read-only through Microsoft Graph and posts financial items to Duna Finanzas' inbox (buzon-v1)."
requires-python = ">=3.13"
dependencies = [
    "msal>=1.33.0",
    "httpx>=0.28.1",
    "cryptography>=46.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duna_buzon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
